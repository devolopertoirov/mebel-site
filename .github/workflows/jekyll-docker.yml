name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ "main" ]

  # GitHub interfeysidan turib qo'lda ham ishga tushirish imkoniyati
  workflow_dispatch:

# GitHub Pages'ga yuklash uchun kerakli ruxsatlarni sozlash
permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtning o'zida ikkita o'zgarish bo'lsa, eskisini to'xtatib, yangisini ishga tushiradi
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Loyihangizga mos Ruby versiyasi
          bundler-cache: true # Kutubxonalarni keshlab, tez ishlashini ta'minlaydi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
